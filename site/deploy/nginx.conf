# Web pública de Web Pulsar (webpulsar.es) — archivos estáticos en /var/www/webpulsar.
# Independiente del CRM: no toca crm.webpulsar.es ni su configuración.
# Antes de activar, sustituye <RUTA_CERTIFICADO> y <RUTA_CLAVE> por las rutas reales
# del certificado de origen de Cloudflare que cubra webpulsar.es y www.webpulsar.es.

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name webpulsar.es www.webpulsar.es;
    return 301 https://webpulsar.es$request_uri;
}

# www → dominio raíz
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.webpulsar.es;

    ssl_certificate     <RUTA_CERTIFICADO>;
    ssl_certificate_key <RUTA_CLAVE>;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://webpulsar.es$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name webpulsar.es;

    ssl_certificate     <RUTA_CERTIFICADO>;
    ssl_certificate_key <RUTA_CLAVE>;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/webpulsar;
    index index.html;
    server_tokens off;
    charset utf-8;

    # Compresión (Brotli solo si el módulo está instalado: descomenta esas líneas)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json application/xml text/plain;
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/css application/javascript application/json image/svg+xml application/manifest+json application/xml text/plain;

    # Cabeceras de seguridad. CSP compatible con Turnstile (formulario) y con el CRM (API).
    # Stripe Checkout es una redirección a checkout.stripe.com: no necesita scripts ni iframes de Stripe aquí.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://crm.webpulsar.es https://challenges.cloudflare.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;

    # Assets con hash de Vite: caché de un año
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://crm.webpulsar.es https://challenges.cloudflare.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Imágenes, vídeo y audio sin hash: caché de una semana
    location ~* \.(?:webp|avif|png|jpg|jpeg|svg|mp4|webm|mp3|wav|vtt|woff2)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html nunca en caché, para que cada despliegue se vea al momento
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://crm.webpulsar.es https://challenges.cloudflare.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Fallback SPA: las rutas del frontend (/privacidad, /pago/exito…) sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
